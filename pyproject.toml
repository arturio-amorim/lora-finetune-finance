[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-finetune-finance"
version = "0.1.0"
description = "LoRA fine-tuning of a small open LLM into a concise personal-finance assistant, with before/after comparison."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Arturio Amorim Sobrinho" }]
keywords = ["fine-tuning", "lora", "peft", "transformers", "trl", "llm", "huggingface"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
